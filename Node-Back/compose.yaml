services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vacancy_aggregator
      MYSQL_USER: starter
      MYSQL_PASSWORD: starter_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
